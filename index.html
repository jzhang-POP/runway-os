<!doctype html>

<title>[POP] Runway OS</title>

<style>
  /* Layout: Win95 desktop. Absolutely placed windows over the desktop color, launcher icons on the left,
     taskbar with Start, one button per window, and a tray (rendering hourglass, balance, clock).
     Signature: the credit balance as a red seven-segment LED counter, Minesweeper style.
     Bevels keep 98.css's four roles (frame, shadow, face, highlight) with light from the top left. */
  /* MS Sans Serif, the Win95 system font, as a pixel font (from 98.css, MIT). Sharp at multiples of 11 screen pixels. */
  @font-face { font-family: "MS Sans Serif 95"; src: url("fonts/ms_sans_serif.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "MS Sans Serif 95"; src: url("fonts/ms_sans_serif_bold.woff2") format("woff2"); font-weight: 700; }
  /* IBM Plex Sans (SIL Open Font License), one variable file for all weights: the default UI font */
  @font-face { font-family: "IBM Plex Sans"; src: url("fonts/ibm_plex_sans_variable.woff2") format("woff2"); font-weight: 100 700; }
  /* DotGothic16 (SIL Open Font License), Latin subset: a pixel-style font drawn as outlines, sharp at any size */
  @font-face { font-family: "DotGothic16"; src: url("fonts/dotgothic16_latin.woff2") format("woff2"); font-weight: 400; }
  /* Atkinson Hyperlegible (Braille Institute, SIL Open Font License): the most readable option */
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("fonts/atkinson_hyperlegible_400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("fonts/atkinson_hyperlegible_700.woff2") format("woff2"); font-weight: 700; }

  /* ---------- tokens ----------
     --scale (set by Options → Scale, text px / 11) sizes everything: text, bars, buttons, icons, spacing.
     Bevel and border lines stay whole pixels (1–2 px); scaled sizes are rounded to whole pixels. */
  :root {
    --scale: 1;
    --u: calc(var(--scale) * 1px);
    --fs: 11px; --fs2: 22px; --fsL: 22px;
    --ui: "MS Sans Serif 95", Tahoma, sans-serif;
    --mono: "Courier New", Courier, monospace;
    /* spacing */
    --s1: round(calc(4 * var(--u)), 1px);
    --s2: round(calc(6 * var(--u)), 1px);
    --s3: round(calc(8 * var(--u)), 1px);
    --s4: round(calc(12 * var(--u)), 1px);
    --s5: round(calc(16 * var(--u)), 1px);
    /* sizes */
    --bar: round(calc(34 * var(--u)), 1px);
    --title-h: round(calc(22 * var(--u)), 1px);
    --cb-w: round(calc(18 * var(--u)), 1px); --cb-h: round(calc(16 * var(--u)), 1px);
    --btn-h: round(calc(24 * var(--u)), 1px);
    --seg-h: round(calc(20 * var(--u)), 1px);
    --ico: round(calc(14 * var(--u)), 1px);
    --ico-m: round(calc(16 * var(--u)), 1px);
    --ico-l: round(calc(20 * var(--u)), 1px);
    --ico-xl: round(calc(32 * var(--u)), 1px);
    --g1: max(1px, round(var(--u), 1px)); --g2: round(calc(2 * var(--u)), 1px);
    --desk: var(--theme-desk);
    --led-on: #ff2b1c; --led-off: #2c0907; --led-bg: #0c0303;
  }
  /* ---------- color themes (html[data-theme], also used by the theme previews in Options) ---------- */
  :root, [data-theme="dark"] {
    color-scheme: dark; --theme-desk: #0b2e2e;
    --face: #2a2b30; --face-2: #1d1e22; --pressed: #232428;
    --hi: #737680; --lo: #08090b; --mid: #3c3e45; --deep: #141519;
    --fg: #e4e4e8; --muted: #9a9ca6; --strong: #fff;
    --title-a: #000a5c; --title-b: #1f6fc4; --title-off-a: #3b3d44; --title-off-b: #5a5d66; --title-off-fg: #e4e4e8;
    --blue: #6ea8ff; --sel: #0a2a8a; --sel-off: #3c3e45;
    --ok: #5fdc7a; --run: #ffc94a; --bad: #ff6b6b; --err-bg: #2a1214;
  }
  [data-theme="classic"] {
    color-scheme: light; --theme-desk: #008080;
    --face: #c0c0c0; --face-2: #fff; --pressed: #c0c0c0;
    --hi: #fff; --lo: #000; --mid: #dfdfdf; --deep: #808080;
    --fg: #000; --muted: #474747; --strong: #000;
    --title-a: #000080; --title-b: #0f79bf; --title-off-a: #686868; --title-off-b: #757575; --title-off-fg: #fff;
    --blue: #0a2fa8; --sel: #000080; --sel-off: #686868;
    --ok: #005a00; --run: #6b4400; --bad: #a00000; --err-bg: #ffe2e2;
  }
  [data-theme="storm"] {
    color-scheme: dark; --theme-desk: #1a2230;
    --face: #2b3340; --face-2: #1e242e; --pressed: #252c38;
    --hi: #707f94; --lo: #07090c; --mid: #3b4554; --deep: #151a22;
    --fg: #e3e8ef; --muted: #9aa5b5; --strong: #fff;
    --title-a: #1b2d4f; --title-b: #4a74b0; --title-off-a: #3a4250; --title-off-b: #5b6474; --title-off-fg: #e3e8ef;
    --blue: #7fb0ff; --sel: #2d4f86; --sel-off: #3b4554;
    --ok: #6fdc8a; --run: #ffcf5a; --bad: #ff7a7a; --err-bg: #2e1618;
  }
  [data-theme="eggplant"] {
    color-scheme: dark; --theme-desk: #2a1430;
    --face: #3a2e3f; --face-2: #2a2130; --pressed: #322837;
    --hi: #8b7695; --lo: #0c080e; --mid: #4b3c52; --deep: #1b141e;
    --fg: #ede4f0; --muted: #b3a2bb; --strong: #fff;
    --title-a: #4a1050; --title-b: #9a4fa8; --title-off-a: #44394a; --title-off-b: #62566a; --title-off-fg: #ede4f0;
    --blue: #c9a0ff; --sel: #6a2a78; --sel-off: #4b3c52;
    --ok: #6fdc8a; --run: #ffcf5a; --bad: #ff8080; --err-bg: #3a1418;
  }
  [data-theme="marine"] {
    color-scheme: light; --theme-desk: #004040;
    --face: #b4d0c8; --face-2: #f2f8f6; --pressed: #a8c4bc;
    --hi: #fff; --lo: #10201c; --mid: #d6e8e3; --deep: #6f8f87;
    --fg: #0d1f1b; --muted: #34504a; --strong: #000;
    --title-a: #00504a; --title-b: #248275; --title-off-a: #586d69; --title-off-b: #5d7b74; --title-off-fg: #fff;
    --blue: #00507a; --sel: #00605a; --sel-off: #586d69;
    --ok: #10602a; --run: #6b4400; --bad: #a3161a; --err-bg: #f9dcdc;
  }
  [data-theme="pumpkin"] {
    color-scheme: light; --theme-desk: #5a3300;
    --face: #e8c89a; --face-2: #fff7ea; --pressed: #dcba88;
    --hi: #fffaf0; --lo: #2b1a08; --mid: #f4dcb8; --deep: #9a7446;
    --fg: #1f1406; --muted: #57401f; --strong: #000;
    --title-a: #8a3a00; --title-b: #b16018; --title-off-a: #78664e; --title-off-b: #8c704a; --title-off-fg: #fff;
    --blue: #1d4a8a; --sel: #8a3a00; --sel-off: #78664e;
    --ok: #1c5f1c; --run: #6b4400; --bad: #a3161a; --err-bg: #ffe0d6;
  }
  /* high contrast: Win95's High Contrast Black, on top of any theme */
  html.contrast { color-scheme: dark; --face: #000; --face-2: #000; --pressed: #000; --hi: #fff; --lo: #fff; --mid: #000; --deep: #000; --fg: #fff; --muted: #ffff00; --strong: #fff;
    --title-a: #800080; --title-b: #800080; --title-off-a: #000; --title-off-b: #000; --title-off-fg: #fff; --sel: #800080; --sel-off: #404040; --blue: #00ffff; --ok: #00ff00; --run: #ffff00; --bad: #ff4040; --err-bg: #000; }
  html.contrast .window, html.contrast .taskbar, html.contrast .menu, html.contrast .startmenu { outline: 2px solid #fff; outline-offset: -2px; }
  /* text on a selection (--sel, --sel-off) keeps the selection's own colors: status and accent colors only read on --face and --face-2 */
  .row.sel .st { --ok: #fff; --run: #fff; --bad: #fff; --muted: #fff; }
  .window:not(.front) .row.sel small, .window:not(.front) .row.sel .muted, .window:not(.front) .row.sel .est { color: #fff; }
  .sp-row:focus-visible b, .xkey:hover .xreq, .xkey:focus-visible .xreq { color: #fff; }
  .xkey:focus-visible .muted { color: #c9d4ff; }
  /* smooth font: Tahoma at any size */
  html.smooth { --ui: Tahoma, Verdana, "Segoe UI", system-ui, sans-serif; }
  html.smooth body { -webkit-font-smoothing: auto; -moz-osx-font-smoothing: auto; }
  html.dot { --ui: "DotGothic16", Tahoma, Verdana, system-ui, sans-serif; }
  html.plex { --ui: "IBM Plex Sans", Tahoma, Verdana, system-ui, sans-serif; }
  html.hyper { --ui: "Atkinson Hyperlegible", Tahoma, Verdana, system-ui, sans-serif; }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  :where(:not(.window, .window *)) { scrollbar-width: none; } /* the screen is a monitor: only windows scroll */
  :where(:not(.window, .window *))::-webkit-scrollbar { display: none; }
  /* ---------- scrollbars, target sizes ----------
     Win95 scrollbars inside windows, from the theme tokens: a dithered track, a raised thumb, raised arrow buttons.
     Scrollers with a 2 px bevel (.sunken, .field, .raised, .term) keep the bevel around the bar. */
  .window { --sb: round(calc(16 * var(--u)), 1px); }
  .window ::-webkit-scrollbar { width: var(--sb); height: var(--sb); }
  .window ::-webkit-scrollbar-track { background: var(--face) conic-gradient(var(--hi) 25%, #0000 0 50%, var(--hi) 0 75%, #0000 0) 0 0 / 2px 2px; }
  .window ::-webkit-scrollbar-thumb, .window ::-webkit-scrollbar-button { background-color: var(--face); box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo), inset 2px 2px 0 var(--mid), inset -2px -2px 0 var(--deep); }
  .window ::-webkit-scrollbar-thumb:vertical { min-height: var(--sb); }
  .window ::-webkit-scrollbar-thumb:horizontal { min-width: var(--sb); }
  .window ::-webkit-scrollbar-button { display: block; width: var(--sb); height: var(--sb); background-repeat: no-repeat; background-position: center; }
  .window ::-webkit-scrollbar-button:start:increment, .window ::-webkit-scrollbar-button:end:decrement { display: none; }
  .window ::-webkit-scrollbar-button:vertical:decrement { background-image: conic-gradient(from 135deg at 50% 0, var(--fg) 90deg, #0000 0); background-size: calc(2 * var(--s1)) var(--s1); }
  .window ::-webkit-scrollbar-button:vertical:increment { background-image: conic-gradient(from -45deg at 50% 100%, var(--fg) 90deg, #0000 0); background-size: calc(2 * var(--s1)) var(--s1); }
  .window ::-webkit-scrollbar-button:horizontal:decrement { background-image: conic-gradient(from 45deg at 0 50%, var(--fg) 90deg, #0000 0); background-size: var(--s1) calc(2 * var(--s1)); }
  .window ::-webkit-scrollbar-button:horizontal:increment { background-image: conic-gradient(from 225deg at 100% 50%, var(--fg) 90deg, #0000 0); background-size: var(--s1) calc(2 * var(--s1)); }
  .window ::-webkit-scrollbar-button:active { background-color: var(--pressed); background-position: calc(50% + 1px) calc(50% + 1px); box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--deep), inset -2px -2px 0 var(--mid); }
  .window ::-webkit-scrollbar-corner { background: var(--face); }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar { width: calc(var(--sb) + 2px); height: calc(var(--sb) + 2px); }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-track, .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-thumb,
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-button, .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-corner { border: 0 solid #0000; background-clip: padding-box; }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-track:vertical, .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-thumb:vertical, .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-button:vertical { border-right-width: 2px; }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-track:horizontal, .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-thumb:horizontal, .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-button:horizontal { border-bottom-width: 2px; }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-button:vertical:decrement { border-top-width: 2px; height: calc(var(--sb) + 2px); }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-button:vertical:increment { border-bottom-width: 2px; height: calc(var(--sb) + 2px); }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-button:vertical:increment:corner-present { border-bottom-width: 0; height: var(--sb); }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-button:horizontal:decrement { border-left-width: 2px; width: calc(var(--sb) + 2px); }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-button:horizontal:increment { border-right-width: 2px; width: calc(var(--sb) + 2px); }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-button:horizontal:increment:corner-present { border-right-width: 0; width: var(--sb); }
  .window :is(.sunken, .field, .raised, .term)::-webkit-scrollbar-corner { border-width: 0 2px 2px 0; }
  @supports not selector(::-webkit-scrollbar) { /* Firefox draws its own bar: theme colors only */
    .window { scrollbar-color: var(--face) var(--face-2); }
    html.contrast .window { scrollbar-color: var(--fg) var(--face-2); }
  }
  /* minimum target size (WCAG 2.2, 2.5.8): 24 × 24 px, or spaced so a 24 px circle on each target touches no other target */
  .ctl { --cb-gap: max(0px, calc(24px - var(--cb-w))); gap: var(--cb-gap); }
  .ctl-gap { margin-left: calc(-1 * var(--cb-gap)); }
  .window .rz.n, .window .rz.ne { height: 4px; } /* the top edge stays clear of the caption buttons */
  .window .rz.e { width: 5px; }
  .ctl button, .bx { position: relative; }
  .ctl button::before, .bx::before { content: ""; position: absolute; inset: min(0px, calc(var(--cb-h) / 2 - 12px)) min(0px, calc(var(--cb-w) / 2 - 12px)); } /* 24 × 24 hit area */
  .th, .trayitem, .menu button, .check, .field { min-height: 24px; }
  .sp-row { min-height: 24px; align-items: center; }
  label.opt-radio, label.opt-check { padding-block: max(var(--g2), calc((24px - 1lh) / 2)); }
  button.xkey { padding-block: max(2px, calc((24px - 1lh) / 2)); }
  details.more > summary { padding-block: max(0px, calc((24px - 1lh) / 2)); }
  .tsize .tsz-marks { height: max(1.6em, 24px); }
  .tsz-marks button { min-width: 24px; min-height: 24px; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--desk); color: var(--fg); font: var(--fs)/1.45 var(--ui); -webkit-font-smoothing: none; -moz-osx-font-smoothing: unset; font-smooth: never; text-rendering: optimizeSpeed; }
  body.dragging { cursor: default; }
  body.dragging video, body.dragging iframe { pointer-events: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button:disabled { color: var(--muted); cursor: default; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 1px dotted var(--fg); outline-offset: -4px; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .grow { flex: 1; }
  code { font: var(--fs) var(--mono); }
  kbd { font: var(--fs) var(--ui); color: var(--muted); margin-left: auto; padding-left: calc(2 * var(--s4)); }
  .ptbl.keytbl { grid-template-columns: max-content 1fr; }
  .keytbl dt { white-space: nowrap; }
  .keytbl kbd { margin: 0; padding: 0 var(--s2); color: inherit; font: var(--fs) var(--ui); box-shadow: inset -1px -1px 0 var(--b-deep, #808080), inset 1px 1px 0 var(--b-hi, #fff); }
  .keys .group { margin: 0; }

  /* bevels */
  .raised { background: var(--face); border: 0; box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo), inset 2px 2px 0 var(--mid), inset -2px -2px 0 var(--deep); }
  .sunken, .field { background: var(--face-2); border: 0; box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--deep), inset -2px -2px 0 var(--mid); }
  button.raised { cursor: pointer; }
  button.raised:not(:disabled):active, button.raised[aria-pressed="true"], button.raised[aria-expanded="true"] { background: var(--pressed); box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--deep), inset -2px -2px 0 var(--mid); }
  .etch { width: 100%; border: 0; border-top: 1px solid var(--lo); border-bottom: 1px solid var(--hi); margin: 0; }

  /* buttons: one height and padding for every variant */
  .btn-s, .btn-ok, .btn-go, .seg-tabs button { min-height: var(--btn-h); padding: 0 var(--s4); display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); white-space: nowrap; text-decoration: none; color: var(--fg); flex: none; }
  .btn-go { padding: 0 var(--s5); font-weight: 700; }
  .btn-go .ico { width: var(--ico-m); height: var(--ico-m); }
  .btn-go:disabled .ico { opacity: .45; }
  .btn-ok { min-width: round(calc(84 * var(--u)), 1px); outline: 1px solid var(--lo); }
  .seg-tabs { display: flex; gap: 2px; }
  button.linkish { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  button.linkish:hover { text-decoration: underline; }

  /* button icons and tones, as on Win95 toolbars: a 16 px pixel icon before the label tells actions apart.
     Icons: gold sparkle = makes something new, folder = file, pages = copy, red = danger.
     Markup: <button class="raised btn-s [b-default | b-danger]"><svg class="ico" aria-hidden="true"><use href="#i-…"/></svg><span>Label</span></button>
     b-default (one per group) gets Win95's default-button frame and a bold label; .btn-ok is always the default. */
  .btn-s .ico, .btn-ok .ico { width: var(--ico-m); height: var(--ico-m); }
  .btn-s:has(> .ico) { padding-left: var(--s3); }
  button:disabled > .ico, .menu button:disabled > .mico { opacity: .4; filter: grayscale(1); }
  .btn-s, .btn-ok, .btn-go { background: light-dark(var(--face), color-mix(in srgb, var(--face), var(--mid) 35%)); }
  button.raised.b-default, button.raised.btn-ok { font-weight: 700; box-shadow: inset 1px 1px 0 var(--lo), inset -2px -2px 0 var(--lo), inset 2px 2px 0 var(--hi), inset -3px -3px 0 var(--deep), inset 3px 3px 0 var(--mid); }
  button.raised.b-default:not(:disabled):active, button.raised.btn-ok:not(:disabled):active { box-shadow: inset 0 0 0 1px var(--lo), inset 0 0 0 2px var(--deep); }
  .btn-ok:not(:focus-visible) { outline: 0; }
  .b-danger { color: var(--bad); }
  .pwrap .actions.wrap { flex-wrap: wrap; }
  .menu button { position: relative; }
  .menu .mico { position: absolute; left: calc((2 * var(--s4) - var(--ico-m)) / 2); top: calc(50% - var(--ico-m) / 2); width: var(--ico-m); height: var(--ico-m); }

  /* fields */
  .field { flex: 1; min-width: round(calc(120 * var(--u)), 1px); max-width: round(calc(320 * var(--u)), 1px); padding: var(--s1) var(--s2); outline: none; }
  .field::placeholder { color: var(--muted); }
  .field:focus { outline: 1px dotted var(--fg); outline-offset: -4px; }
  .combo { position: relative; display: block; min-width: 0; }
  .combo select { width: 100%; max-width: none; appearance: none; -webkit-appearance: none; padding-right: calc(var(--cb-w) + var(--s3)); cursor: pointer; text-overflow: ellipsis; }
  .combo select option { background: var(--face-2); color: var(--fg); }
  .combo::after { content: ""; position: absolute; top: 2px; right: 2px; bottom: 2px; width: var(--cb-w); pointer-events: none; background: var(--face); box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo), inset 2px 2px 0 var(--mid), inset -2px -2px 0 var(--deep); }
  .combo::before { content: ""; position: absolute; z-index: 1; top: 50%; right: calc(2px + var(--cb-w) / 2); transform: translate(50%, -50%); pointer-events: none;
    border-left: var(--s1) solid transparent; border-right: var(--s1) solid transparent; border-top: var(--s1) solid var(--fg); }
  .combo[hidden] { display: none; }
  .check { display: flex; align-items: center; gap: var(--s3); color: var(--fg) !important; cursor: pointer; }
  .check input { width: round(calc(13 * var(--u)), 1px); height: round(calc(13 * var(--u)), 1px); margin: 0; accent-color: var(--blue); }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: round(calc(140 * var(--u)), 1px); height: var(--btn-h); background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: var(--s1); background: var(--face-2); box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--hi); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: calc(11 * var(--u)); height: var(--seg-h); margin-top: calc(var(--s1) / 2 - var(--seg-h) / 2); background: var(--face); box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo), inset 2px 2px 0 var(--mid), inset -2px -2px 0 var(--deep); }
  input[type="range"]::-moz-range-track { height: var(--s1); background: var(--face-2); box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--hi); }
  input[type="range"]::-moz-range-thumb { width: calc(11 * var(--u)); height: var(--seg-h); border: 0; border-radius: 0; background: var(--face); box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo), inset 2px 2px 0 var(--mid), inset -2px -2px 0 var(--deep); }

  /* icons */
  .ico { width: var(--ico); height: var(--ico); flex: none; }
  .ico.big { width: round(calc(26 * var(--u)), 1px); height: round(calc(26 * var(--u)), 1px); }

  /* ---------- desktop ---------- */
  #desktop { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px)); overflow: hidden; }
  /* desktop icons sit on a grid (app.js layoutIcons): each has a slot, moved by dragging */
  .icons { position: absolute; inset: 0; pointer-events: none; }
  .icons .dicon { position: absolute; left: 0; top: 0; pointer-events: auto; touch-action: none; }
  .icons .dicon.dragging { z-index: 5; opacity: .75; transition: none; }
  .icons:not(.ready) .dicon { visibility: hidden; }
  .dicon { width: round(calc(78 * var(--u)), 1px); padding: var(--s1) 2px; display: flex; flex-direction: column; align-items: center; gap: var(--s1); background: none; border: 0; color: #fff; cursor: default; text-align: center; }
  .dicon svg { width: var(--ico-xl); height: var(--ico-xl); }
  .dicon span { padding: 0 var(--g2); }
  .dicon:focus { outline: none; }
  .dicon:focus span { background: var(--sel); outline: 1px dotted #fff; }
  .dicon:focus svg { opacity: .7; }
  .snap { position: absolute; z-index: 99990; pointer-events: none; outline: 2px dotted #c9cbd3; outline-offset: -4px; background: rgba(31, 111, 196, .12); }
  .flycap { position: fixed; z-index: 200000; pointer-events: none; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2); overflow: hidden; white-space: nowrap; background: linear-gradient(90deg, var(--title-a), var(--title-b)); color: #fff; font-weight: 700; }

  /* ---------- windows ---------- */
  .window { position: absolute; display: flex; flex-direction: column; padding: 3px; min-width: 0; }
  .titlebar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); height: var(--title-h); padding: 0 3px 0 var(--s1); background: linear-gradient(90deg, var(--title-off-a), var(--title-off-b)); color: var(--title-off-fg); font-weight: 700; cursor: default; user-select: none; -webkit-user-select: none; touch-action: none; }
  .window.front .titlebar { background: linear-gradient(90deg, var(--title-a), var(--title-b)); color: #fff; }
  .titlebar .t { display: flex; align-items: center; gap: var(--s1); min-width: 0; overflow: hidden; white-space: nowrap; }
  .tt { overflow: hidden; text-overflow: ellipsis; }
  .ticon { width: var(--ico-m); height: var(--ico-m); }
  .ctl { display: flex; flex: none; }
  .ctl-gap { width: 2px; }
  .ctl button, .bx { width: var(--cb-w); height: var(--cb-h); padding: 0; display: grid; place-items: center; flex: none; }
  /* caption glyphs, drawn on a 10×9 grid that scales */
  .ctl i, .bx i { display: block; position: relative; width: round(calc(10 * var(--u)), 1px); height: round(calc(9 * var(--u)), 1px); }
  .g-min::after { content: ""; position: absolute; left: var(--g1); bottom: 0; width: round(calc(6 * var(--u)), 1px); height: var(--g2); background: var(--fg); }
  .g-max::after { content: ""; position: absolute; inset: 0; border: var(--g1) solid var(--fg); border-top-width: var(--g2); }
  .window.max .g-max::after { inset: round(calc(3 * var(--u)), 1px) round(calc(3 * var(--u)), 1px) 0 0; background: var(--face); }
  .window.max .g-max::before { content: ""; position: absolute; inset: 0 0 round(calc(3 * var(--u)), 1px) round(calc(3 * var(--u)), 1px); border: var(--g1) solid var(--fg); border-top-width: var(--g2); }
  .g-close::before, .g-close::after { content: ""; position: absolute; left: 0; top: calc(50% - var(--g2) / 2); width: 100%; height: var(--g2); background: var(--fg); transform: rotate(45deg); }
  .g-close::after { transform: rotate(-45deg); }
  .wbody { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; container-type: inline-size; }
  .rz { position: absolute; z-index: 2; touch-action: none; }
  .rz.n { top: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
  .rz.s { bottom: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
  .rz.e { right: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
  .rz.w { left: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
  .rz.ne, .rz.nw, .rz.se, .rz.sw { width: 14px; height: 14px; }
  .rz.ne { top: -3px; right: -3px; cursor: nesw-resize; } .rz.sw { bottom: -3px; left: -3px; cursor: nesw-resize; }
  .rz.nw { top: -3px; left: -3px; cursor: nwse-resize; } .rz.se { bottom: -3px; right: -3px; cursor: nwse-resize; }
  .window.max .rz { display: none; }
  .window.busy { user-select: none; -webkit-user-select: none; }
  .window.drop .wbody { outline: 2px dotted var(--blue); outline-offset: -6px; }
  /* window focus: the window itself takes focus only when it has no control to; its active title bar shows it */
  .window:focus { outline: none; }
  html.contrast .window:focus { outline: 2px solid #fff; outline-offset: -2px; }
  /* keyboard Move and Size (window menu): a black and white dotted frame, readable on every theme, while the arrow keys work */
  .window.kbmode::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; border: 2px solid #000; outline: 2px dotted #fff; outline-offset: -2px; }

  /* ---------- shared window parts ---------- */
  .toolbar { flex: none; display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); flex-wrap: wrap; }
  /* bottom bars: .statusbar (read-only segments + size grip) and .footbar (segment + buttons) */
  .statusbar { flex: none; display: flex; gap: 2px; padding: 2px calc(var(--s4) + var(--s1)) 2px 2px; position: relative; min-width: 0; }
  .statusbar::after { content: ""; position: absolute; right: 2px; bottom: 2px; width: var(--s4); height: var(--s4); background: linear-gradient(135deg, transparent 0 45%, var(--hi) 45% 52%, transparent 52% 62%, var(--hi) 62% 69%, transparent 69% 79%, var(--hi) 79% 86%, transparent 86%); }
  .window.max .statusbar::after { display: none; }
  .footbar { flex: none; display: flex; gap: var(--s2); padding: var(--s1) var(--s3) var(--s3); align-items: stretch; min-width: 0; }
  .seg { padding: 2px var(--s3); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; font-variant-numeric: tabular-nums; min-height: var(--seg-h); }
  .seg.grow { flex: 1; min-width: 0; display: block; line-height: calc(var(--seg-h) - 4px); }
  .seg.why { color: var(--run); }
  .nav { display: flex; gap: 2px; flex: none; }
  /* empty states */
  .empty-list { padding: calc(2 * var(--s4)); text-align: center; color: var(--muted); margin: auto; max-width: 42ch; }
  /* group boxes: fieldset.group and details.more.group */
  .group { margin: 0; padding: var(--s3) var(--s4) var(--s4); border: 0; min-width: 0; box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); }
  .ubody { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--s3) var(--s2); display: flex; flex-direction: column; gap: var(--s3); }
  .uchart { width: 100%; height: round(calc(180 * var(--u)), 1px); display: block; overflow: hidden; background: var(--face-2); }
  .uchart .ugrid { stroke: var(--mid); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .uchart .ulab { fill: var(--muted); font: var(--fs) var(--ui); }
  .ulegend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); margin-top: var(--s2); }
  .ulegend button, .utable span { display: inline-flex; align-items: center; gap: var(--s1); min-width: 0; }
  .ulegend i, .utable i { width: round(calc(10 * var(--u)), 1px); height: round(calc(10 * var(--u)), 1px); flex: none; display: inline-block; }
  .ucols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18em), 1fr)); gap: var(--s3); }
  .utable { display: flex; flex-direction: column; gap: 2px; }
  .utable > div, .utable > button { display: grid; grid-template-columns: minmax(0, 1fr) auto 4.5em; gap: var(--s2); align-items: baseline; padding: 2px var(--s1); }
  .utable > :nth-child(odd) { background: var(--face-2); }
  .utable span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .utable b { font-weight: 400; font-variant-numeric: tabular-nums; color: var(--blue); text-align: right; }
  .utable small { color: var(--muted); font-size: var(--fs); text-align: right; font-variant-numeric: tabular-nums; }
  .unote { margin: var(--s2) 0 0; }
  /* usage: chart colors (dark, storm and eggplant use the default; light themes darker; high contrast bright on black),
     the drawn chart, the model filter buttons and the inspected day */
  :root { --uc1: #6ea8ff; --uc2: #ffc94a; --uc3: #5fdc7a; --uc4: #ff6b6b; --uc5: #c678dd; --uc6: #56b6c2; --uc7: #e5a46b; --uc8: #9a9ca6; }
  html[data-theme="classic"], html[data-theme="marine"], html[data-theme="pumpkin"] { --uc1: #1f5fbf; --uc2: #8a5a00; --uc3: #1c7a3a; --uc4: #b3261e; --uc5: #7b3fa0; --uc6: #0e6f7a; --uc7: #9a4f12; --uc8: #5f6670; }
  html.contrast { --uc1: #00ffff; --uc2: #ffff00; --uc3: #00ff00; --uc4: #ff6060; --uc5: #ff80ff; --uc6: #8080ff; --uc7: #ffa500; --uc8: #c0c0c0; }
  html.contrast .uchart .ugrid { stroke: var(--fg); stroke-dasharray: 1 3; }
  .uchart svg { display: block; width: 100%; height: 100%; }
  .uday { cursor: pointer; }
  .uday:focus, .uday:focus-visible { outline: none; }
  .uhit { fill: transparent; }
  .uday[aria-pressed="true"] .uhit { fill: var(--mid); }
  html.contrast .uday[aria-pressed="true"] .uhit { fill: var(--sel); }
  .uday:focus-visible .uhit { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 1 1; }
  .ubar { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s1) var(--s3); }
  .ufilter { margin-bottom: var(--s2); }
  .ufilter:empty, .uinspect:empty { display: none; }
  .uinspect { margin-top: var(--s3); padding-top: var(--s3); box-shadow: inset 0 1px 0 var(--lo), inset 0 2px 0 var(--hi); }
  .uinspect .ubar { margin-bottom: var(--s2); }
  .ulegend button, .utable > button { background: none; border: 0; padding: 2px var(--s1); cursor: pointer; text-align: left; }
  .utable > button { width: 100%; }
  .ulegend button[aria-pressed="true"], .utable > button[aria-pressed="true"] { background: var(--sel); color: #fff; }
  .utable > button[aria-pressed="true"] b, .utable > button[aria-pressed="true"] small { color: inherit; }
  .xnote { margin: 0 0 var(--s2); }
  .xkeys { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--s2); max-height: calc(9 * var(--fs) * 1.5); overflow: auto; }
  .xkey { display: flex; flex-wrap: wrap; gap: 0 var(--s2); align-items: baseline; text-align: left; background: none; border: 0; padding: 2px var(--s1); cursor: pointer; color: var(--fg); }
  .xkey:hover, .xkey:focus-visible { background: var(--sel); color: #fff; outline: none; }
  .xkey:hover .muted { color: #c9d4ff; }
  .xreq { color: var(--run); }
  .xjson { width: 100%; max-width: none; min-height: calc(5 * var(--fs) * 1.5); resize: vertical; font-family: "Courier New", Courier, monospace; }
  .group legend { padding: 0 var(--s1); margin-left: -2px; color: var(--fg); background: var(--face); position: relative; z-index: 1; }
  details.more > summary { cursor: pointer; color: var(--fg); list-style-position: inside; }
  details.more[open] > summary { margin-bottom: var(--s3); }
  /* messages */
  .gmsg { padding: var(--s2) var(--s3); color: var(--bad); background: var(--err-bg); box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--mid); overflow-wrap: anywhere; }
  .gmsg.info { color: var(--fg); background: var(--face-2); }
  .actions { display: flex; gap: var(--s2); justify-content: flex-end; flex-wrap: wrap; margin-top: auto; }
  /* job status */
  .st { display: inline-flex; align-items: center; gap: var(--s2); font-weight: 700; white-space: nowrap; }
  .st .dot { width: var(--s3); height: var(--s3); flex: none; }
  .st.done { color: var(--ok); } .st.done .dot { background: var(--ok); }
  .st.running { color: var(--run); } .st.running .dot { border: 1px solid var(--run); background: linear-gradient(90deg, var(--run) 50%, transparent 50%); }
  .st.queued { color: var(--muted); } .st.queued .dot { border: 1px solid var(--muted); }
  .st.failed { color: var(--bad); } .st.failed .dot { background: var(--bad); clip-path: polygon(20% 0, 50% 30%, 80% 0, 100% 20%, 70% 50%, 100% 80%, 80% 100%, 50% 70%, 20% 100%, 0 80%, 30% 50%, 0 20%); }
  .est { font-style: italic; color: var(--muted); }
  /* progress bars: .prog (big, Win95 blocks) and .mprog (in rows) */
  .prog { height: var(--seg-h); padding: 3px; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 100%; background: repeating-linear-gradient(90deg, var(--blue) 0 var(--s4), transparent var(--s4) calc(var(--s4) + 2px)); opacity: .25; transition: width .4s steps(8); }
  .prog.busy i { opacity: 1; width: 40%; animation: marquee 1.6s steps(24) infinite; }
  .mprog { display: block; height: var(--s3); padding: 2px; margin: var(--s1) 0 2px; max-width: round(calc(140 * var(--u)), 1px); overflow: hidden; }
  .mprog i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--blue) 0 5px, transparent 5px 6px); }
  .mprog i.ind { animation: marquee 1.6s steps(24) infinite; width: 40% !important; }
  @keyframes marquee { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .live { font-weight: 700; display: inline-flex; align-items: center; gap: var(--s2); }
  .live::before { content: ""; width: var(--s3); height: var(--s3); background: var(--muted); }
  .live.on { color: var(--ok); } .live.on::before { background: var(--ok); animation: blink 1.2s steps(2) infinite; }
  .live.warn { color: var(--run); } .live.warn::before { background: var(--run); }
  .live.off { color: var(--bad); } .live.off::before { background: var(--bad); }
  @keyframes blink { 50% { opacity: .3; } }
  .flash { animation: flash 1.4s steps(4); }
  @keyframes flash { from { color: var(--run); } }
  /* thumbnails */
  .thumb { position: relative; display: block; width: 100%; aspect-ratio: 1; padding: 0; flex: none; overflow: hidden; }
  button.thumb { cursor: pointer; }
  .thumb img, .thumb video { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); object-fit: cover; }
  .thumb .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .thumb .empty .ico.big { opacity: .85; }
  .thumb img + .empty { display: none; }
  .thumb img[hidden] + .empty { display: grid; }
  .empty.plus { font-size: var(--fsL); }
  .mini { position: relative; width: var(--ico-xl); height: var(--ico-xl); flex: none; display: grid; place-items: center; overflow: hidden; }
  .mini img { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); object-fit: cover; }
  .play { position: absolute; left: 50%; top: 50%; width: round(calc(26 * var(--u)), 1px); height: round(calc(22 * var(--u)), 1px); transform: translate(-50%, -50%); background: rgba(8, 9, 11, .72); box-shadow: inset 1px 1px 0 #55575f, inset -1px -1px 0 #08090b; z-index: 1; }
  .play::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-35%, -50%); border-left: var(--s3) solid #fff; border-top: var(--s2) solid transparent; border-bottom: var(--s2) solid transparent; }
  .thumb video ~ .play, .thumb:has(video) .play { display: none; }
  .tile.sel .thumb, .sframe[aria-pressed="true"] .thumb { outline: 1px dotted var(--fg); outline-offset: 2px; }
  .cap { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 1px var(--g2); align-self: center; max-width: 100%; }
  .tile.sel .cap, .sframe[aria-pressed="true"] .cap { background: var(--sel); color: #fff; }
  .window:not(.front) .tile.sel .cap { background: var(--sel-off); }

  /* ---------- property sheets (System Properties, Options) ---------- */
  .sheet { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: var(--s3); }
  .tabs { display: flex; padding-left: 2px; position: relative; z-index: 1; }
  .tab { min-height: calc(var(--btn-h) - 2px); padding: 0 var(--s4); margin-right: -1px; background: var(--face); border: 0; cursor: pointer; position: relative; top: 2px;
    box-shadow: inset 1px 1px 0 var(--hi), inset -1px 0 0 var(--lo), inset 2px 2px 0 var(--mid), inset -2px 0 0 var(--deep); }
  .tab[aria-selected="true"] { top: 0; min-height: calc(var(--btn-h) + 2px); padding: 0 calc(var(--s4) + 2px) 2px; margin: 0 -2px; z-index: 2; }
  .tabpanel { flex: 1; min-height: 0; overflow: auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
  .sheet-foot { flex: none; display: flex; justify-content: flex-end; gap: var(--s2); padding-top: var(--s3); }

  /* System Properties */
  .sp-gen { display: flex; gap: calc(var(--s5) + var(--s2)); align-items: flex-start; }
  .sp-logo { flex: none; width: round(calc(96 * var(--u)), 1px); height: round(calc(96 * var(--u)), 1px); }
  .sp-logo svg { width: 100%; height: 100%; display: block; }
  .sp-facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: var(--s2) var(--s4); flex: 1; min-width: 0; }
  .sp-facts dt { color: var(--muted); }
  .sp-facts dd { margin: 0 0 var(--s3); min-width: 0; }
  .sp-facts.tight dd { margin: 0; }
  .sp-facts .led { margin-bottom: var(--s2); }
  .sp-facts dd > .muted { display: block; }
  .sp-facts .prog { margin-top: var(--s2); }
  .sp-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 2px var(--s5); }
  .sp-row { display: flex; justify-content: space-between; gap: var(--s3); padding: var(--g2) var(--s1); background: none; border: 0; cursor: pointer; text-align: left; }
  .sp-row b { font-weight: 400; color: var(--blue); font-variant-numeric: tabular-nums; }
  .sp-row:hover, .sp-row:focus-visible { background: var(--sel); color: #fff; outline: none; }
  .sp-row:hover b { color: #fff; }
  .sp-chart .muted { margin-top: var(--s2); }
  .down { color: var(--led-on); font-weight: 700; }
  /* LED balance readout: a device, so it keeps its own colors in every theme */
  .led { display: inline-flex; align-items: center; gap: 3px; padding: var(--s2) var(--s3); background: var(--led-bg); max-width: 100%; overflow: hidden; }
  .dig { width: round(calc(20 * var(--u)), 1px); height: round(calc(36 * var(--u)), 1px); flex: none; filter: drop-shadow(0 0 2.5px rgba(255, 43, 28, .45)); }
  .dig .on { fill: var(--led-on); } .dig .off { fill: var(--led-off); }
  .led .gap { width: var(--s2); flex: none; }
  .led.flash .on { animation: ledflash .5s steps(1) 3; }
  @keyframes ledflash { 50% { fill: #ffd2c9; } }
  /* the 24 h chart: an oscilloscope, black in every theme */
  .spark { width: 100%; display: block; height: round(calc(120 * var(--u)), 1px); background: #000; box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--hi); }
  .spark path { fill: none; stroke: #39ff6a; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .spark circle { fill: #39ff6a; }
  .spark .gl { stroke: #0b4d1c; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .spark-empty { height: round(calc(120 * var(--u)), 1px); padding: var(--s4); display: grid; place-items: center; text-align: center; background: #000; color: #39ff6a; }
  @container (max-width: 40em) { .sp-gen { flex-direction: column; } .sp-rows { grid-template-columns: 1fr; } }

  /* ---------- terminal ---------- */
  .term { flex: 1; min-height: 0; overflow: auto; margin: 2px; padding: var(--s3) var(--s3); background: #000; color: #c0c0c0; font: var(--fs)/1.35 var(--mono); cursor: text;
    box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--deep), inset -2px -2px 0 var(--mid); user-select: text; -webkit-user-select: text; }
  .t-out, .t-line, .t-in { font-family: var(--mono); font-weight: 700; }
  .t-out { margin: 0; font-size: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
  .t-line { display: flex; align-items: baseline; }
  .t-prompt { color: #c0c0c0; white-space: pre; }
  .t-in { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 0; color: #fff; caret-color: #c0c0c0; font-size: inherit; }
  .t-neo { display: inline-flex; gap: 2.5em; align-items: flex-start; white-space: pre; }
  .t-logo { width: 9em; height: 11.7em; flex: none; fill: #6ea8ff; }
  .t-acc { color: #6ea8ff; font-weight: 700; }
  .t-red { color: var(--led-on); }
  .t-err { color: #ff6b6b; }
  .t-dim { color: #808080; }

  /* ---------- notes: the files in notes/ on the left, the editor on the right ----------

  /* ---------- jobs: details view ---------- */
  .table { flex: 1; min-height: 0; overflow: auto; margin: 0 var(--s3) var(--s1); padding: 2px;
    --cols: minmax(round(calc(180 * var(--u)), 1px), 1fr) round(calc(58 * var(--u)), 1px) round(calc(128 * var(--u)), 1px) round(calc(150 * var(--u)), 1px) round(calc(64 * var(--u)), 1px) round(calc(86 * var(--u)), 1px); }

  @container (max-width: 58em) { .table { --cols: minmax(round(calc(150 * var(--u)), 1px), 1fr) round(calc(140 * var(--u)), 1px) round(calc(60 * var(--u)), 1px) round(calc(78 * var(--u)), 1px); } .c-type, .c-model { display: none !important; } }

  .menu button { display: flex; align-items: center; gap: var(--s3); padding: var(--s1) var(--s4) var(--s1) calc(2 * var(--s4)); background: none; border: 0; text-align: left; cursor: default; white-space: nowrap; }

  .balloon { position: fixed; right: max(var(--s3), env(safe-area-inset-right, 0px)); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + var(--s3)); z-index: 140000; width: min(round(calc(320 * var(--u)), 1px), calc(100vw - 2 * var(--s3))); display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s3) var(--s3) var(--s4); }

  /* ---------- taskbar, tray, start menu ---------- */
  .taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--bar) + env(safe-area-inset-bottom, 0px)); padding: var(--s1) max(var(--s1), env(safe-area-inset-right, 0px)) calc(var(--s1) + env(safe-area-inset-bottom, 0px)) max(var(--s1), env(safe-area-inset-left, 0px)); display: flex; gap: var(--s2); align-items: stretch; z-index: 100000; }
  .start { font-weight: 700; padding: 0 var(--s3); display: flex; align-items: center; gap: var(--s2); flex: none; }
  #tasks { flex: 1; min-width: 0; display: flex; gap: var(--s1); overflow: hidden; }
  .task { flex: 0 1 round(calc(180 * var(--u)), 1px); min-width: round(calc(40 * var(--u)), 1px); padding: 0 var(--s3); display: flex; align-items: center; gap: var(--s2); overflow: hidden; white-space: nowrap; }

  .trayitem:hover { color: var(--strong); }
  #tray-run { color: var(--run); font-weight: 700; }
  .clock { padding: 0 var(--s2); font-variant-numeric: tabular-nums; cursor: default; }
  .startmenu { position: fixed; left: max(var(--s1), env(safe-area-inset-left, 0px)); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) - 2px); z-index: 100001; padding: 3px; min-width: round(calc(210 * var(--u)), 1px); display: flex; flex-direction: column; }
  .startmenu { max-height: calc(100dvh - var(--bar) - env(safe-area-inset-bottom, 0px) + 2px); overflow-y: auto; } /* short screens and large Scale: scroll instead of running off the top */
  .startmenu button { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4) var(--s2) var(--s3); background: none; border: 0; text-align: left; cursor: pointer; }
  .startmenu button svg { width: round(calc(22 * var(--u)), 1px); height: round(calc(22 * var(--u)), 1px); }
  .startmenu button:hover, .startmenu button:focus-visible { background: var(--sel); color: #fff; outline: none; }

  /* ---------- boot screen: one centered column (logo, name, progress bar, the checks, Start); black like a real boot ---------- */
  .boot { position: fixed; inset: 0; z-index: 300000; background: #000; color: #c0c0c0; font-family: var(--ui); font-size: var(--fs); overflow: auto; cursor: default;
    display: grid; place-items: center; padding: var(--s5) max(var(--s4), env(safe-area-inset-right, 0px)) var(--s5) max(var(--s4), env(safe-area-inset-left, 0px)); }
  .boot.out { opacity: 0; transition: opacity .2s; pointer-events: none; }

  .boot-logo svg { display: block; width: round(calc(96 * var(--u)), 1px); height: round(calc(96 * var(--u)), 1px); }
  .boot-name { color: #fff; font-size: var(--fs2); font-weight: 600; margin-bottom: var(--s2); }
  .boot-bar { width: 100%; height: round(calc(22 * var(--u)), 1px); padding: 3px; background: #000; box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #fff, inset 2px 2px 0 #000, inset -2px -2px 0 #dfdfdf; }
  .boot-bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, #1f6fc4 0 round(calc(10 * var(--u)), 1px), transparent 0 round(calc(12 * var(--u)), 1px)); transition: width .25s steps(6); }
  html.calm .boot-bar i { transition: none; }
  .boot-log { width: 100%; margin: var(--s1) 0 0; padding: 0; list-style: none; }
  .boot-log li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s4); align-items: baseline; padding: 1px 0; }
  .boot-log li > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .boot-log .res { color: #fff; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .boot-log .res.wait { color: #808080; }
  .boot-log .res.bad { color: #ff6b6b; }
  .boot-sum { color: #fff; min-height: 1.5em; text-align: center; margin-top: var(--s2); }
  .boot-act { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s3); margin-top: var(--s2);
    --face: #c0c0c0; --pressed: #c0c0c0; --hi: #fff; --lo: #000; --mid: #dfdfdf; --deep: #808080; --fg: #000; }
  .boot-act:empty { display: none; }
  .boot-act .btn-s { padding: var(--s2) var(--s5); font-weight: 600; color: #000; }
  .boot-act .btn-s.default { outline: 1px solid #000; }
  .boot-act .btn-s:focus-visible, .boot-act .btn-s:focus { outline: 1px dotted #000; outline-offset: calc(-1 * var(--s1)); }
  .boot-act .btn-s.default:focus { box-shadow: 0 0 0 1px #000, inset 1px 1px 0 #fff, inset -1px -1px 0 #000, inset 2px 2px 0 #dfdfdf, inset -2px -2px 0 #808080; }
  .boot-hint { color: #9a9a9a; text-align: center; min-height: 1.5em; }
  body.booting .taskbar, body.booting #desktop { visibility: hidden; }
  html.contrast .boot, html.contrast .boot-hint { color: #fff; }

  @media (max-width: 600px) {
    .dig { width: round(calc(15 * var(--u)), 1px); height: round(calc(27 * var(--u)), 1px); }
    #tray-bal span, .task span { display: none; }
  }
  /* ---------- job tree: branches of jobs drawn as a pixel skill tree ----------
     --tr-gold: a finished job's frame and the line that feeds it; --tr-board: the tree's backdrop, dotted with --tr-dot */
  :root { --tr-gold: #ffc94a; --tr-board: var(--deep); --tr-dot: var(--mid); }
  html[data-theme="classic"], html[data-theme="marine"], html[data-theme="pumpkin"] { --tr-gold: #9a6400; --tr-board: var(--face-2); --tr-dot: var(--deep); }
  html.contrast { --tr-gold: #ffff00; --tr-board: #000; --tr-dot: #808080; }
  .tree-wrap { flex: 1; min-height: 0; overflow: auto; margin: 0 var(--s3) var(--s1); padding: var(--s4); display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; gap: var(--s4); }
  .tree-wrap.empty { display: grid; }
  .tbranch { flex: none; width: min-content; display: flex; flex-direction: column; padding: 3px; background: var(--face); box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo), inset 2px 2px 0 var(--mid), inset -2px -2px 0 var(--deep); }
  .tb-head { display: flex; flex-direction: column; padding: var(--s1) var(--s2) var(--s2); width: 0; min-width: 100%; } /* the tree, not its title, sets the width */
  .tb-head > b, .tb-sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb-sum { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tb-sum b { color: var(--fg); }
  .tb-canvas, .tb-flow { position: relative; flex: none; align-self: center;
    background: linear-gradient(90deg, var(--tr-board) calc(100% - 1px), transparent 0) 0 0 / round(calc(8 * var(--u)), 1px) round(calc(8 * var(--u)), 1px),
      linear-gradient(var(--tr-board) calc(100% - 1px), var(--tr-dot) 0) 0 0 / round(calc(8 * var(--u)), 1px) round(calc(8 * var(--u)), 1px);
    box-shadow: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--deep), inset -2px -2px 0 var(--mid); }
  .tb-solo { flex: 1 1 100%; width: auto; }
  .tb-flow { align-self: stretch; display: flex; flex-wrap: wrap; gap: round(calc(18 * var(--u)), 1px); padding: round(calc(18 * var(--u)), 1px); }
  .tb-lines { position: absolute; left: 0; top: 0; display: block; overflow: visible; }
  .te-out, .te-in { fill: none; stroke-linejoin: miter; }
  .te-out { stroke: var(--lo); stroke-width: round(calc(6 * var(--u)), 2px); }
  .te-in { stroke: var(--tr-gold); stroke-width: round(calc(2 * var(--u)), 2px); }

  @keyframes tr-flow { to { stroke-dashoffset: -8; } }
  .te-knot { fill: var(--face); stroke: var(--lo); stroke-width: 2; }
  .te-knot.on { fill: var(--tr-gold); }
  /* the operation on a line: a flat plate, not a button */
  .ttag { position: absolute; z-index: 1; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: var(--s1); padding: 1px var(--s2) 1px var(--s1); white-space: nowrap; line-height: 1.2; background: var(--face); border: 1px solid var(--lo); box-shadow: inset 1px 1px 0 var(--mid); }

  .tnode { position: absolute; display: flex; flex-direction: column; align-items: center; cursor: default; text-align: center; }
  .tb-flow .tnode { position: static; }
  /* the slot: a bevelled frame around the thumbnail; its rings say how the job went */
  .tslot { position: relative; display: block; flex: none; width: round(calc(64 * var(--u)), 1px); height: round(calc(64 * var(--u)), 1px); padding: 2px; background: var(--face);
    --ring: var(--deep); box-shadow: 0 0 0 2px var(--lo), 0 0 0 4px var(--ring), 0 0 0 6px var(--lo); }

  .t-done .tslot { --ring: var(--tr-gold); box-shadow: 0 0 0 2px var(--lo), 0 0 0 4px var(--ring), 0 0 0 6px var(--lo), 0 0 0 9px color-mix(in srgb, var(--tr-gold) 30%, transparent); }
  .t-running .tslot { --ring: var(--blue); animation: tr-pulse 1.2s steps(1) infinite; }
  @keyframes tr-pulse { 50% { box-shadow: 0 0 0 2px var(--lo), 0 0 0 4px var(--ring), 0 0 0 6px var(--lo), 0 0 0 9px color-mix(in srgb, var(--blue) 35%, transparent); } }
  .t-failed .tslot, .t-queued .tslot { --ring: var(--mid); }
  .t-failed .thumb img, .t-queued .thumb img { filter: grayscale(1); opacity: .45; }
  .t-missing .tslot { background: none; box-shadow: none; outline: 2px dashed var(--muted); outline-offset: 2px; }
  .t-missing .thumb { background: var(--tr-board); box-shadow: none; }
  .tcount { position: absolute; right: -3px; top: -3px; z-index: 1; padding: 0 var(--g2); background: var(--lo); color: #fff; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .tx { position: absolute; right: 3px; bottom: 3px; width: var(--s4); height: var(--s4); background: var(--bad); clip-path: polygon(20% 0, 50% 30%, 80% 0, 100% 20%, 70% 50%, 100% 80%, 80% 100%, 50% 70%, 20% 100%, 0 80%, 30% 50%, 0 20%); }
  .tname { max-width: 100%; margin-top: round(calc(12 * var(--u)), 1px); padding: 1px var(--g2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
  .tcost { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .t-done .tcost { color: var(--tr-gold); }
  .t-failed .tcost { color: var(--bad); }
  .tnode.sel .tname { background: var(--sel); color: #fff; }
  .window:not(.front) .tnode.sel .tname { background: var(--sel-off); }

  .cmp-grid { --cmp-fh: round(calc(300 * var(--u)), 1px); display: grid; grid-template-columns: repeat(auto-fill, minmax(max(min(100%, round(calc(220 * var(--u)), 1px)), calc((100% - (var(--cmp-cols, 2) - 1) * var(--s3)) / var(--cmp-cols, 2))), 1fr)); grid-auto-rows: auto minmax(var(--cmp-fh), 1fr) auto; gap: var(--s2) var(--s3); }
  .cmp-grid.one { flex: 1 0 auto; --cmp-fh: round(calc(200 * var(--u)), 1px); }
  .cmp-grid.infos { grid-auto-rows: auto auto; }
  .cmp-col { display: grid; grid-row: span 3; grid-template-rows: subgrid; min-width: 0; padding: var(--s2) var(--s2) var(--s4); }
  .cmp-grid.infos .cmp-col { grid-row: span 2; }
  .cmp-head { display: flex; align-items: center; gap: var(--s2); min-width: 0; padding: 1px var(--g2); }
  .cmp-head .nm1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-letter { flex: none; min-width: round(calc(16 * var(--u)), 1px); text-align: center; background: #ffffe1; color: #000; box-shadow: inset 0 0 0 1px #000; }
  .cmp-col.sel .cmp-head { background: var(--sel); color: #fff; }
  .window:not(.front) .cmp-col.sel .cmp-head { background: var(--sel-off); }
  .checker { background-color: #4a4a4a; background-image: conic-gradient(#5c5c5c 25%, #4a4a4a 0 50%, #5c5c5c 0 75%, #4a4a4a 0); background-size: round(calc(16 * var(--u)), 1px) round(calc(16 * var(--u)), 1px); }
  .cmp-frame { position: relative; overflow: hidden; min-height: 0; }
  .cmp-frame > img, .cmp-frame > video { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); object-fit: contain; user-select: none; -webkit-user-select: none; }
  .cmp-frame.actual { overflow: auto; display: flex; cursor: grab; }
  .cmp-frame.actual.panning { cursor: grabbing; }
  .cmp-frame.actual > img { position: static; margin: auto; width: auto; height: auto; max-width: none; flex: none; }
  .cmp-frame.audio { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s4); padding: var(--s4); background: var(--face-2); }
  .cmp-frame.audio audio { width: 100%; }
  .cmp-frame .aud-ico { width: var(--ico-xl); height: var(--ico-xl); }
  .cmp-frame.none { display: grid; place-items: center; background: var(--face-2); color: var(--muted); text-align: center; padding: var(--s4); }
  .cmp-frame.none .ico.big { width: var(--ico-xl); height: var(--ico-xl); display: block; margin: 0 auto var(--s2); }
  .cmp-info { display: flex; flex-direction: column; gap: var(--s2); }
  .cmp-dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s1) var(--s3); align-items: baseline; }

  .cmp-dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .cmp-dl dd.same, .cmp-prompt.same { color: var(--muted); }
  .cmp-dl dd.diff, .cmp-dl dd .diff { font-weight: 700; color: var(--strong); }

  .cw-scroll { position: absolute; inset: 2px; overflow: hidden; display: flex; }
  .cmp-wipe.actual .cw-scroll { overflow: auto; }
  .cmp-wipe.actual { cursor: grab; }
  .cmp-wipe.actual.panning { cursor: grabbing; }
  .cw-canvas { position: relative; flex: none; width: 100%; height: 100%; margin: auto; }
  .cw-canvas > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-select: none; pointer-events: none; }
  .cw-line { position: absolute; top: 0; bottom: 0; width: round(calc(3 * var(--u)), 1px); margin-left: round(calc(-1.5 * var(--u)), 1px); background: #fff; box-shadow: 0 0 0 1px #000; cursor: ew-resize; z-index: 1; }

  .cw-tag { position: absolute; top: var(--s2); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 1px var(--s2); background: #ffffe1; color: #000; box-shadow: inset 0 0 0 1px #000; pointer-events: none; z-index: 1; }
  .cw-tag.a { left: var(--s2); }
  .cw-tag.b { right: var(--s2); }

  /* reduced motion */
  html.calm .prog.busy i, html.calm .mprog i.ind, html.calm .live.on::before, html.calm .flash, html.calm .led.flash .on { animation: none; }
  html.calm .prog i, html.calm .boot.out { transition: none; }
</style>
